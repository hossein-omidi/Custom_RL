# Balanced PPO configuration: preserve the November 11 trainer baseline.
# Shared timing and exposed stochastic settings are inherited from configs/base.yaml.
# Plant/reward dictionaries are not forwarded by the current trainer CLI;
# their effective values come from the existing registration/trainer defaults.
# Mode (roughing/finishing) is selected by scripts/sweep_ppo.py.
extends: ../base.yaml

seeds: [0, 1, 2]
run_name: null

# Prevent the inherited plant.ap_max from being passed to roughing as --ap-max.
# Finishing receives its explicit --ap-max from the sweep runner.
plant:
  ap_max: null

train:
  total_timesteps: 491520
  n_envs: 3
  vec_env: subproc
  start_method: spawn
  device: cpu
  progress_bar: true
  learning_rate: 0.00025
  final_learning_rate: 0.000025
  n_steps: 2048
  batch_size: 256
  n_epochs: 8
  gamma: 0.999995
  gae_lambda: 0.9995
  clip_range: 0.20
  final_clip_range: 0.10
  n_eval_episodes: 5
  eval_freq: 122880
  checkpoint_freq: 245760
  callback_eval_seed: 10000
